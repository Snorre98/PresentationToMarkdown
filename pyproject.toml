[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presentation-to-markdown"
version = "0.1.0"
description = "Convert PowerPoint (.pptx) and PDF documents to Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
    "pymupdf_layout>=1.28.2",
    "sqlite-vec>=0.1.9",
    "numpy>=1.26",
]

[project.scripts]
ptm = "cli:main"
ptm-start = "start:main"
ptm-transcribe = "cli_transcribe:main"

[tool.setuptools]
packages = ["converter"]
py-modules = ["cli", "cli_common", "cli_transcribe", "start", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
