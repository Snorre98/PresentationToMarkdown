[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presentation-to-markdown"
version = "0.1.0"
description = "Convert PowerPoint (.pptx) and PDF documents to Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
    "PyMuPDF>=1.24",
    "pymupdf_layout>=1.28.2",
    "sqlite-vec>=0.1.9",
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
    "flask>=3.0",
    "flask-sock>=0.7",
    "simple-websocket>=1.0",
]

[project.scripts]
ptm-engine = "engine:main"

[tool.setuptools]
packages = ["converter"]
py-modules = ["engine", "cli_common", "lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
